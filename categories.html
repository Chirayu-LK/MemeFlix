<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Categories/meemflix</title>
    <style>
      body {
        background-image: url(bgm.png);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
      }
      nav {
        background-color: darkslategray;
        height: 80px;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
      }
      #logo {
        width: 300px;
        height: auto;
      }
      #link {
        width: 80%;
        display: flex;
        justify-content: space-evenly;
      }
      .links {
        text-decoration: none;
        color: aliceblue;
      }
      .box {
        box-sizing: border-box;
        display: flex;
        background-image: radial-gradient(rgb(41, 2, 2), rgb(0, 0, 157));
        border-radius: 50px;
        width: 140px;
        height: 40px;
        justify-content: center;
        align-items: center;
        border: 5px solid;
        border-radius: 50px;
        border-image: linear-gradient(to right, violet, red) 1;
        font-size: 19px;
      }
      #present {
        font-weight: bold;
      }
      .box:hover {
        width: 160px;
        height: 50px;
        font-size: 24px;
      }
      #catr1 {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        height: 500px;
        width: 1500px;
      }
      #catr2 {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        height: 500px;
        width: 1500px;
      }
      .cate:hover {
        img {
          width: 800px;
          height: auto;
        }
      }
      @media (max-width: 600px) {
        nav {
          height: auto;
          flex-direction: column;
          padding: 15px 0;
        }
        #logo {
          width: 200px;
          margin-bottom: 15px;
        }
        #link {
          width: 100%;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }
        .box {
          width: 130px;
          height: 35px;
          font-size: 16px;
          border-width: 3px;
        }
        .box:hover {
          width: 130px;
          height: 35px;
          font-size: 16px;
        }
        #catr1,#catr2 {
          width: 100%;
          height: auto;
          flex-direction: column;
          gap: 40px;
          margin: 40px 0;
        }
        .cate img {
          width: 80%;
          height: auto;
          max-width: 350px;
        }
        .cate:hover img {
          width: 80%;
          max-width: 350px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <img id="logo" src="logo.png" alt="logo" />
      <div id="link">
        <div class="box">
          <a class="links" href="index.html" target="_self">HOME</a>
        </div>
        <div class="box">
          <a class="links" href="trending.html" target="_self">TRENDING</a>
        </div>
        <div class="box">
          <div id="present">
            <a
              class="links"
              href="categories.html"
              target="_self"
              style="color: rgb(112, 187, 231)"
              >CATEGORIES</a
            >
          </div>
        </div>
      </div>
    </nav>
    <div id="cat">
      <div id="catr1">
        <div id="cat1">
          <a class="cate" href="english.html" target="_self">
            <img src="english.png" alt="click me" width="auto" height="300px" />
          </a>
        </div>
        <div id="cat2">
          <a class="cate" href="hindi.html" target="_self">
            <img src="hindi.png" alt="click me" width="auto" height="300px" />
          </a>
        </div>
      </div>
      <div id="catr2">
        <div id="cat3">
          <a class="cate" href="kannada.html" target="_self">
            <img src="kannada.png" alt="click me" width="auto" height="300px" />
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
