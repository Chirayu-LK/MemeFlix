<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Memes</title>

    <style>
        body{
            background-image: url(bgmi.png);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            padding: 0;
        }
        nav{
            background-color: darkslategray;
            height: 80px;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
        }
        #logo{
            width: 300px;
            height: auto;
        }
        #link{
            width: 80%;
            display: flex;
            justify-content: space-evenly;
        }
        .links{
            text-decoration: none;
            color: aliceblue;
        }
        .box{
            box-sizing: border-box;
            display: flex;
            background-image: radial-gradient(rgb(41, 2, 2),rgb(0, 0, 157));
            border-radius: 50px;
            width: 140px;
            height: 40px;
            justify-content: center;
            align-items: center;
            border: 5px solid;
            border-image: linear-gradient(to right,violet,red)1;
            font-size: 19px;
        }
        #present{
            font-weight: bold;
        }
        .box:hover{
            width: 160px;
            height: 50px;
            font-size: 24px;
        }
        #title{
            text-align: center;
            color: gold;
            font-style: italic;
            margin-top: 25px;
            font-size: 32px;
        }
        #row1{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            height: 400px;
            align-items: center;
        }
        #row2{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            height: 400px;
            align-items: center;
        }
        .vid{
            display: flex;
            flex-direction: column;
            width: 400px;
            height: 300px;
            background-color: rgb(95, 85, 90);
            align-items: center;
            justify-content: center;
            color: gold;
            border-radius: 50px;
            border: 5px solid rgb(213, 191, 191);
        }
        video{
            height: 200px;
            width: 349.14px;
        }
        h2{
            font-style: italic;
            margin-bottom: 0;
        }
        @media (max-width: 600p){
            nav {
                height: auto;
                min-height: 160px;
                flex-direction: column;
                padding: 15px 0;
            }
            #logo {
                width: 200px;
                margin-bottom: 15px;
            }
            #link {
                width: 100%;
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
            .box {
                width: 130px;
                height: 35px;
                font-size: 16px;
                border-width: 3px;
            }
            .box:hover {
                width: 130px;
                height: 35px;
                font-size: 16px;
            }
            #title {
                font-size: 26px;
                margin-top: 20px;
            }
            #row1,#row2 {
                flex-direction: column;
                height: auto;
                justify-content: center;
                gap: 30px;
                margin: 30px 0;
            }    
            .vid {
                width: 90%;
                max-width: 400px;
                height: auto;
                min-height: 280px;
                border-radius: 30px;
            }
            video {
                width: 90%;
                height: auto;
                max-height: 220px;
            }
            h2 {
                font-size: 20px;
                text-align: center;
                margin: 10px;
            }
        }
    </style>
</head>
<body>
    <nav>
        <img id="logo" src="logo.png" alt="logo">
        <div id="link">
            <div class="box"><div id="present"><a class="links" href="index.html">HOME</a></div></div>
            <div class="box"><a class="links" href="trending.html">TRENDING</a></div>
            <div class="box"><a class="links" href="categories.html">CATEGORIES</a></div>
        </div>
    </nav>
    <h1 id="title">ENGLISH MEMES</h1>
    <div id="row1">

        </div>
        <div class="vid" id="vid2">
            <video controls>
                <source src="meme11.mp4" type="video/mp4">
            </video>
            <h2><b>Leanardo Di'caprio pointing finger</b></h2>
        </div>
        <div class="vid" id="vid3">
            <video controls>
                <source src="meme4.mp4" type="video/mp4">
            </video>
            <h2><b>Oh Shit</b></h2>
        </div>
    </div>
    <div id="row2">
        <div class="vid" id="vid4">
            <video controls>
                <source src="meme16.mp4" type="video/mp4">
            </video>
            <h2><b>brother ewww</b></h2>
        </div>
        <div class="vid" id="vid5">
            <video controls>
                <source src="meme5.mp4 " type="video/mp4">
            </video>

    </div>
</body>

</html>
