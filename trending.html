<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trending/memeflix</title>
    <style>
      body {
        background-image: url(bgm.png);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        margin: 0;
        padding: 0;
      }
      nav {
        background-color: darkslategray;
        height: 80px;
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
      }
      #logo {
        width: 300px;
        height: auto;
      }
      #link {
        width: 80%;
        display: flex;
        justify-content: space-evenly;
      }
      .links {
        text-decoration: none;
        color: aliceblue;
      }
      .box {
        box-sizing: border-box;
        display: flex;
        background-image: radial-gradient(rgb(41, 2, 2), rgb(0, 0, 157));
        border-radius: 50px;
        width: 140px;
        height: 40px;
        justify-content: center;
        align-items: center;
        border: 5px solid;
        border-radius: 50px;
        border-image: linear-gradient(to right, violet, red) 1;
        font-size: 19px;
      }
      #present {
        font-weight: bold;
      }
      .box:hover {
        width: 160px;
        height: 50px;
        font-size: 24px;
      }
      #list {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        height: 2200px;
      }
      .lists {
        display: flex;
        width: 800px;
        background-image: linear-gradient(red, black);
        padding: 50px;
        border-radius: 130px;
      }
      .livid {
        display: flex;
        width: 800px;
        justify-content: center;
        align-items: center;
      }
      ol li::marker {
        font-size: 54px;
        font-weight: bold;
        color: coral;
      }
      ol {
        font-size: 28px;
        color: beige;
      }
      @media (max-width: 600px) {
        nav {
          height: auto;
          flex-direction: column;
          padding: 15px 0;
        }
        #logo {
          width: 200px;
          margin-bottom: 15px;
        }
        #link {
          width: 100%;
          flex-direction: column;
          align-items: center;
          gap: 10px;
        }
        .box {
          width: 130px;
          height: 35px;
          font-size: 16px;
          border-width: 3px;
        }
        .box:hover {
          width: 130px;
          height: 35px;
          font-size: 16px;
        }
        #list {
          height: auto;
          width: 100%;
          gap: 30px;
          padding: 30px 0;
        }
        .lists {
          box-sizing: border-box;
          width: 90%;
          padding: 30px 15px;
          border-radius: 50px;
        }
        .livid {
          width: 100%;
        }
        .livid video {
          width: 90%;
          height: auto;
          max-width: 350px;
        }
        ol {
          font-size: 22px;
          padding-left: 35px;
          margin: 0;
          width: 100%;
        }
        ol li::marker {
          font-size: 35px;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <img id="logo" src="logo.png" alt="logo" />
      <div id="link">
        <div class="box">
          <a class="links" href="index.html" target="_self">HOME</a>
        </div>
        <div class="box">
          <div id="present">
            <a
              class="links"
              href="trending.html"
              target="_self"
              style="color: rgb(112, 187, 231)"
              >TRENDING</a
            >
          </div>
        </div>
        <div class="box">
          <a class="links" href="categories.html" target="_self">CATEGORIES</a>
        </div>
      </div>
    </nav>
    <div id="list">
      <div class="lists">
        <ol>
          <li>BYE BYE</li>
          <div class="livid">
            <video height="220px" width="auto" controls>
              <source src="meme2.mp4" type="video/mp4" />
            </video>
          </div>
        </ol>
      </div>
      <br />
      <br />
      <div class="lists">
        <ol start="2">
          <li>Depression</li>
          <div class="livid">
            <video height="150px" width="auto" controls>
              <source src="meme3.mp4" type="video/mp4" />
            </video>
          </div>
        </ol>
      </div>
      <br />
      <br />
      <div class="lists">
        <ol start="3">
          <li>African laughter</li>
          <div class="livid">
            <video height="150px" width="auto" controls>
              <source src="meme5.mp4" type="video/mp4" />
            </video>
          </div>
        </ol>
      </div>
      <br />
      <br />
      <div class="lists">
        <ol start="4">
          <li>Chai Laughing</li>
          <div class="livid">
            <video height="150px" width="auto" controls>
              <source src="meme7.mp4" type="video/mp4" />
            </video>
          </div>
        </ol>
      </div>
      <br />
      <br />
      <div class="lists">
        <ol start="5">
          <li>Nana Patekar's laugh</li>
          <div class="livid">
            <video height="150px" width="auto" controls>
              <source src="meme12.mp4" type="video/mp4" />
            </video>
          </div>
        </ol>
      </div>
    </div>
  </body>
</html>
